version: 2

# Define las tablas de Bronze como fuentes de datos para dbt.
# Usar {{ source() }} en lugar de referencias directas permite:
# 1. Que dbt construya el linaje de datos automáticamente
# 2. Controlar la database mediante variables de entorno
#    (AIRBNB_DEV_BRONZE en desarrollo, AIRBNB_PROD_BRONZE en producción)
# 3. Añadir tests de fuente (freshness, not_null) en el futuro

sources:
  - name: bronze
    database: "{{ env_var('DBT_DATABASE_BRONZE', 'AIRBNB_DEV_BRONZE') }}"
    schema: BRONZE
    tables:
      - name: raw_listings
        description: >
          Dato crudo de listings de Inside Airbnb para las 9 ciudades españolas
          del proyecto (Madrid, Málaga, Girona, Sevilla, Barcelona, Mallorca,
          Valencia, Euskadi y Menorca). Snapshot de junio 2026. ~126K filas
          (109.607 listings únicos), 80 columnas (79 originales + columna city
          añadida en la carga). Todo en tipo TEXT — ninguna transformación
          aplicada en Bronze.

          Cada ciudad se scrapea a lo largo de varios días dentro del mismo
          snapshot trimestral, así que last_scraped tiene varias fechas por
          ciudad (Madrid: 5 fechas entre 2026-06-20 y 2026-07-02). Los marts
          de Gold filtran por una ventana de 30 días, no por el máximo exacto.

      - name: raw_reviews
        description: >
          Dato crudo de reseñas de Inside Airbnb para las 9 ciudades españolas
          del proyecto. Snapshot de junio 2026. ~5.3M filas. Incluye fecha,
          reviewer_id y texto del comentario. El texto se descarta en Silver
          por volumen y falta de valor analítico.